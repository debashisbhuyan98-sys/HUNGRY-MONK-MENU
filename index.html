/* The website automatically builds the menu from MENU_DATA. */
function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderMenu() {
  const menu = document.getElementById("menu");
  menu.innerHTML = MENU_DATA.map(section => `
    <section class="category">
      <h2>${esc(section.category)}</h2>
      ${section.items.map(item => `
        <div class="item" data-name="${esc(item.name.toLowerCase())}">
          <div><h3>${esc(item.name)}</h3></div>
          <span class="price ${item.price ? "" : "pending"}">${item.price ? esc(item.price) : "Price"}</span>
        </div>
      `).join("")}
    </section>
  `).join("");
}

function filterMenu() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  document.querySelectorAll(".item").forEach(item => {
    item.classList.toggle("hidden", q && !item.dataset.name.includes(q));
  });
  document.querySelectorAll(".category").forEach(category => {
    const visible = [...category.querySelectorAll(".item")].some(item => !item.classList.contains("hidden"));
    category.classList.toggle("hidden", !visible);
  });
}
